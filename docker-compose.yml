name: opengym-kit

volumes:
  api_storage:

networks:
  main:
    driver: bridge

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "5"

x-security-baseline: &security-baseline
  security_opt:
    - no-new-privileges:true
    - apparmor=docker-default
  cap_drop:
    - ALL

services:

  # ---- openGym API (passkey auth + per-user JSON storage + AI coach) ----
  api:
    <<: *security-baseline
    # Default image, no AI runtime inside. The AI coach still works with the API-key
    # providers (Anthropic, OpenAI, Gemini, OpenAI-compatible e.g. Ollama): a coach job is
    # a single HTTPS request from the api process, so nothing is spawned or installed.
    image: ghcr.io/duartesantos8/opengym-api:latest
    hostname: api
    networks: ['main']
    restart: unless-stopped
    # Not published: only reachable from web on the 'main' network.
    volumes:
      # users, passkeys, per-user state, session secret, uploads,
      # coach API keys (coach.json, encrypted with ./secret) - BACK THIS UP
      - api_storage:/data
    env_file:
      - path: .env
        required: true
    environment:
      # Passkeys are bound to the browser-facing hostname, never the container name.
      - RP_ID=${HOST}
      - ORIGIN=https://${HOST}
      # Pinned: compose owns the data location, change the volume instead.
      - DATA_DIR=/data
      - PORT=3000
      # Safe here: the API is reachable only through web, which overwrites
      # X-Forwarded-For / X-Real-IP with the real peer.
      - TRUST_PROXY=1
      # Guard against HOST from .env being read as a bind address.
      - HOST=0.0.0.0
    # The image runs as root, but with ALL capabilities dropped it can only touch files it
    # owns (the volume it created). API-key coach providers spawn no child process, so the
    # SETUID/SETGID privilege drop used by the CLI-based providers is not needed.
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    logging: *default-logging

  # ---- openGym web (nginx: React frontend + /api reverse proxy) ----
  web:
    <<: *security-baseline
    image: ghcr.io/duartesantos8/opengym-web:latest
    hostname: web
    networks: ['main']
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    # No env_file on purpose: nginx renders its config with envsubst at start-up, so only
    # the variables it needs are passed in.
    environment:
      # Image runs as uid 101 and may bind :80 because Docker sets
      # net.ipv4.ip_unprivileged_port_start=0 in the container, no NET_BIND_SERVICE needed.
      - NGINX_PORT=80
      # Where /api is proxied to: must match the API service name above.
      - BACKEND=api
      - PORT=3000
      # Docker's embedded DNS, re-resolved per request so a recreated API is found again.
      - RESOLVER=127.0.0.11
      # Cloudflare sets this header itself (replacing anything the client sent), so let it
      # through: a tunnel does not put the visitor in X-Forwarded-For at all.
      - CF_CONNECTING_IP=$$http_cf_connecting_ip
      - BASE_PATH=
      # Largest upload nginx passes to the API. Keep above MEDIA_VIDEO_MAX_MB (40),
      # and below Cloudflare's 100 MB request cap on the free plan.
      - MEDIA_UPLOAD_MAX=48m
    read_only: true
    tmpfs:
      # pid file and proxy/client body temp paths (image points them at /tmp)
      - /tmp
      # entrypoint renders default.conf here from the template at every start
      - /etc/nginx/conf.d:uid=101,gid=101,mode=0755
      - /var/cache/nginx:uid=101,gid=101,mode=0755
    healthcheck:
      # 127.0.0.1, not localhost: nginx listens on IPv4 only after envsubst.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    logging: *default-logging

  # ---- Cloudflare reverse proxy ----
  cloudflared:
    <<: *security-baseline
    image: cloudflare/cloudflared:latest
    networks: ['main']
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARED_TUNNEL_TOKEN}
    read_only: true
    tmpfs:
      - /tmp
    command: tunnel --metrics 127.0.0.1:60123 --no-autoupdate run
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:60123", "ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    logging: *default-logging

